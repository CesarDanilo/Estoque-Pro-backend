services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estoque-pro-app
    volumes:
      - .:/var/www/html
    depends_on:
      - pgsql
    networks:
      - estoque-pro

  nginx:
    image: nginx:alpine
    container_name: estoque-pro-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - estoque-pro

  pgsql:
    image: postgres:17-alpine
    container_name: estoque-pro-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque_pro
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    ports:
      - "5433:5432"
    volumes:
      - estoque-pro-pgsql-data:/var/lib/postgresql/data
    networks:
      - estoque-pro

networks:
  estoque-pro:
    driver: bridge

volumes:
  estoque-pro-pgsql-data:
    driver: local